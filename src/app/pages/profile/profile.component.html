<ng-container *ngIf="loading(); else loaded">
  <div class="profile-page">
    <p class="profile-message">Cargando perfil…</p>
  </div>
</ng-container>

<ng-template #loaded>
  <ng-container *ngIf="user() as profile; else errorState">
    <section>
      <div class="profile-actions">
        <button (click)="editProfile()">Configuración</button>
        <button (click)="onDeleteAccount()" class="btn-delete-account">
          Borrar cuenta
        </button>
      </div>
      <div class="profile-page">
        <img src="assets/images/ui/user-avatar.svg" alt="Foto de perfil" class="profile-photo" />
        <h2>{{ profile.username }}</h2>
        <p>{{ profile.email }}</p>
        <p class="profile-bio">{{ profile.bio }}</p>
        <p class="profile-role">Rol: {{ profile.role }}</p>
      </div>
    </section>
  </ng-container>
</ng-template>

<ng-template #errorState>
  <div class="profile-page">
    <p class="profile-message">{{ error() ?? 'No se pudo cargar el perfil.' }}</p>
  </div>
</ng-template>
